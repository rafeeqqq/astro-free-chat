# Devtron values for astro-free-chat (web app), built on the team's base template.
# Lines marked CHANGED differ from the base; "CHANGE ME" must be filled in.
# Secrets (DATABASE_URL, TOKEN_SECRET, GEMINI_API_KEY, ADMIN_PASSWORD) → Devtron App config → Secrets, not here.
# Migrations → CD pipeline Pre-deployment stage: `node scripts/migrate.ts` (same image, DATABASE_URL).
# Daily sync → a Devtron Job (cron), same image: `node scripts/sync.ts` (DATABASE_URL, TOKEN_SECRET, REDASH_API_KEY, CHAT_BASE_URL).
ContainerPort:
  - envoyPort: 8799
    idleTimeout: 1800s
    name: app
    port: 3000
    protocol: TCP
    servicePort: 80
EnvVariables:                         # CHANGED: non-secret settings
  - name: ADMIN_PUBLIC
    value: "1"
  - name: DB_POOL_MAX
    value: "5"                        # connections per pod (max 4 pods × 5 = 20)
  - name: CHAT_BASE_URL
    value: "https://ai-chat.astrolokal.com"   # CHANGE ME: same as the ingress host below
LivenessProbe:                        # CHANGED: port check only, so a database blip never restarts pods
  Path: ""
  command: []
  failureThreshold: 3
  initialDelaySeconds: 20
  periodSeconds: 10
  port: 3000
  successThreshold: 1
  tcp: true                           # CHANGED
  timeoutSeconds: 5
ReadinessProbe:                       # CHANGED: traffic only when the app and the migrated database answer
  Path: /api/health                   # CHANGED
  command: []
  failureThreshold: 3
  initialDelaySeconds: 20
  periodSeconds: 10
  port: 3000
  successThreshold: 1
  tcp: false
  timeoutSeconds: 5
Spec:
  Affinity:
    Key: kubernetes.io/arch
    Values: arm64                     # the image must be built for linux/arm64 (Node 24 base image supports it)
autoscaling:
  MaxReplicas: 4
  MinReplicas: 2
  TargetCPUUtilizationPercentage: 70
  TargetMemoryUtilizationPercentage: 90
  annotations: {}
  behavior: {}
  enabled: true
containerSpec:                        # CHANGED: let the ingress stop sending traffic before a pod stops (no 502s on deploy)
  lifecycle:
    enabled: true
    preStop:
      exec:
        command:
          - sleep
          - "10"
podDisruptionBudget:                  # CHANGED: keep one pod up during node maintenance
  minAvailable: "1"
ingress:
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  className: nginx
  enabled: true
  hosts:
    - host: ai-chat.astrolokal.com    # CHANGE ME: {app_name}.{product_domain}
      pathType: Prefix
      paths:
        - /
  tls:
    - secretName: ai-chat-tls         # CHANGE ME: {app_name}-tls
ingressInternal:
  annotations:
    kubernetes.io/ingress.class: nginx-internal
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  className: nginx-internal
  enabled: false
  hosts:
    - host: ai-chat.astrolokal.com    # CHANGE ME
      pathType: Prefix
      paths:
        - /
  tls:
    - secretName: ai-chat-tls         # CHANGE ME
resources:                            # CHANGED: measured 168 MB idle, 195 MB with 20 parallel chats; 200Mi would get pods killed
  limits:
    cpu: 500m                         # CHANGED (was 200m)
    memory: 512Mi                     # CHANGED (was 200Mi)
  requests:
    cpu: 100m
    memory: 200Mi                     # CHANGED (was 100Mi)
replicaCount: 2                       # CHANGED (was 1): matches MinReplicas
MaxSurge: 1
MaxUnavailable: 0
MinReadySeconds: 60
GracePeriod: 30
